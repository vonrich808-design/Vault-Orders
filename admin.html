<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Vault Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=IBM+Plex+Mono:wght@400;500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--ink:#050505;--green:#111111;--gold:#c9a24b;--gold-soft:#e3c987;--cream:#f1ead7;--muted:#9aa396;--line:rgba(201,162,75,.28)}
*{box-sizing:border-box}
body{margin:0;background:var(--ink);color:var(--cream);font-family:'Jost',sans-serif;font-weight:400}
.wrap{max-width:820px;margin:0 auto;padding:24px 20px 120px}
h1,h2{font-family:'Cinzel',serif;color:var(--gold-soft);letter-spacing:.08em;margin:0 0 14px}
h1{font-size:1.5rem}h2{font-size:1.1rem;margin-top:36px}
.mono{font-family:'IBM Plex Mono',monospace;font-size:.7rem;letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}
label{display:block;margin:12px 0 5px}
input,select,textarea{width:100%;padding:10px;background:var(--green);border:1px solid var(--line);color:var(--cream);font:inherit;border-radius:0}
textarea{resize:vertical}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{border:1px solid var(--line);background:var(--green);padding:16px;margin-bottom:14px}
.card.feat{border-color:var(--gold)}
.checks{display:flex;gap:22px;margin-top:12px;flex-wrap:wrap}
.checks label{display:flex;align-items:center;gap:8px;margin:0;cursor:pointer}
.checks input{width:auto}
button{font-family:'Cinzel',serif;font-weight:700;letter-spacing:.1em;cursor:pointer;border:1px solid var(--gold);background:transparent;color:var(--gold-soft);padding:10px 16px}
button.primary{background:var(--gold);color:var(--ink)}
button.danger{border-color:#a24b4b;color:#e39a9a;padding:6px 12px;font-size:.8rem}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
#bar{position:fixed;left:0;right:0;bottom:0;background:var(--green);border-top:1px solid var(--gold);padding:12px 20px;display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap}
#msg{font-family:'IBM Plex Mono',monospace;font-size:.8rem;min-width:160px}
#login{max-width:360px;margin:20vh auto;padding:0 20px}
.hide{display:none}
@media(max-width:600px){.row{grid-template-columns:1fr}}
</style>
</head>
<body>

<div id="login">
  <h1>Vault Admin</h1>
  <label class="mono" for="pw">Password</label>
  <input id="pw" type="password" autocomplete="current-password">
  <p style="margin-top:16px"><button class="primary" id="loginBtn">Enter</button></p>
  <p id="loginErr" style="color:#e39a9a"></p>
</div>

<div id="app" class="wrap hide">
  <div class="top"><h1>Vault Admin</h1><a class="mono" href="/" target="_blank" style="color:var(--gold)">View site</a></div>

  <h2>Shop</h2>
  <div class="card">
    <div class="row">
      <div><label class="mono">Status</label>
        <select id="s_status"><option value="open">Open (taking orders)</option><option value="closed">Closed</option></select></div>
      <div><label class="mono">Week label</label><input id="s_weekLabel"></div>
    </div>
    <label class="mono">Banner (top of page, optional)</label><input id="s_banner">
    <label class="mono">Closed message</label><input id="s_closedMessage">
    <label class="mono">Tagline</label><input id="s_tagline">
    <label class="mono">Store name</label><input id="s_storeName">
  </div>

  <h2>Cookies of the week</h2>
  <p class="mono" style="color:var(--muted)">Check "Cookie of the week" on any cookie below. Those show at the top of the site.</p>

  <h2>Cookies</h2>
  <div id="list"></div>
  <button id="addBtn">+ Add cookie</button>

  <h2>Pickup, delivery, payment</h2>
  <div class="card">
    <label class="mono">Pickup info</label><input id="s_pickupInfo">
    <label class="mono">Delivery info</label><input id="s_deliveryInfo">
    <div class="row">
      <div><label class="mono">Tax rate %</label><input id="s_taxRate" type="number" step="0.001"></div>
      <div><label class="mono">Venmo</label><input id="s_venmo"></div>
      <div><label class="mono">Cash App</label><input id="s_cashapp"></div>
      <div><label class="mono">Apple Pay number</label><input id="s_applePay"></div>
      <div><label class="mono">Instagram</label><input id="s_instagram"></div>
      <div><label class="mono">Email</label><input id="s_email"></div>
    </div>
  </div>
</div>

<div id="bar" class="hide">
  <span id="msg"></span>
  <button id="saveBtn" class="primary">Save &amp; publish</button>
</div>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const SETTING_KEYS = ['storeName','tagline','status','banner','closedMessage','weekLabel','pickupInfo','deliveryInfo','taxRate','venmo','cashapp','applePay','instagram','email'];
let DATA = null, PW = '';

async function loadMenu(){
  try{ const r = await fetch('/api/menu',{cache:'no-store'}); if(r.ok){ const j = await r.json(); if(j && j.cookies) return j; } }catch(e){}
  return (await fetch('/menu.json',{cache:'no-store'})).json();
}

function fillSettings(){
  SETTING_KEYS.forEach(k => { const el = $('s_'+k); if(el) el.value = DATA.settings[k] ?? ''; });
}
function readSettings(){
  SETTING_KEYS.forEach(k => {
    const el = $('s_'+k); if(!el) return;
    DATA.settings[k] = k === 'taxRate' ? Number(el.value) || 0 : el.value;
  });
}

function renderList(){
  $('list').innerHTML = DATA.cookies.map((c,i) => `
    <div class="card ${c.featured?'feat':''}" data-i="${i}">
      <div class="row">
        <div><label class="mono">Name</label><input data-f="name" value="${esc(c.name)}"></div>
        <div><label class="mono">Price ($)</label><input data-f="price" type="number" step="0.25" value="${esc(c.price)}"></div>
      </div>
      <label class="mono">Description</label>
      <textarea data-f="description" rows="2">${esc(c.description)}</textarea>
      <div class="row">
        <div><label class="mono">Max per order</label><input data-f="limit" type="number" min="1" value="${esc(c.limit)}"></div>
      </div>
      <div class="checks">
        <label><input type="checkbox" data-f="featured" ${c.featured?'checked':''}> Cookie of the week</label>
        <label><input type="checkbox" data-f="available" ${c.available?'checked':''}> Available (uncheck = sold out)</label>
        <button class="danger" data-del="${i}" type="button">Delete</button>
      </div>
    </div>`).join('');
}

function readList(){
  document.querySelectorAll('#list .card').forEach(card => {
    const c = DATA.cookies[Number(card.dataset.i)];
    card.querySelectorAll('[data-f]').forEach(el => {
      const f = el.dataset.f;
      if(el.type === 'checkbox') c[f] = el.checked;
      else if(f === 'price' || f === 'limit') c[f] = Number(el.value) || 0;
      else c[f] = el.value;
    });
  });
}

function msg(t, bad){ $('msg').textContent = t; $('msg').style.color = bad ? '#e39a9a' : 'var(--gold-soft)'; }

async function enter(){
  PW = $('pw').value;
  $('loginErr').textContent = '';
  // Verify the password by posting the current menu unchanged
  DATA = await loadMenu();
  const r = await fetch('/api/menu',{method:'POST',headers:{'content-type':'application/json','x-admin-password':PW},body:JSON.stringify(DATA)});
  if(!r.ok){
    const j = await r.json().catch(()=>({}));
    $('loginErr').textContent = j.error || 'Could not sign in.';
    return;
  }
  sessionStorage.setItem('vaultpw', PW);
  $('login').classList.add('hide');
  $('app').classList.remove('hide');
  $('bar').classList.remove('hide');
  fillSettings(); renderList();
}

$('loginBtn').addEventListener('click', enter);
$('pw').addEventListener('keydown', e => { if(e.key === 'Enter') enter(); });

$('addBtn').addEventListener('click', () => {
  readList();
  DATA.cookies.push({id:'c'+Date.now(), name:'New cookie', description:'', price:5, available:true, featured:false, limit:24});
  renderList();
  window.scrollTo({top:document.body.scrollHeight, behavior:'smooth'});
});

$('list').addEventListener('click', e => {
  const b = e.target.closest('[data-del]'); if(!b) return;
  readList();
  const c = DATA.cookies[Number(b.dataset.del)];
  if(confirm(`Delete "${c.name}"?`)){ DATA.cookies.splice(Number(b.dataset.del),1); renderList(); }
});

$('list').addEventListener('change', e => {
  if(e.target.dataset.f === 'featured') e.target.closest('.card').classList.toggle('feat', e.target.checked);
});

$('saveBtn').addEventListener('click', async () => {
  readSettings(); readList();
  msg('Saving...');
  try{
    const r = await fetch('/api/menu',{method:'POST',headers:{'content-type':'application/json','x-admin-password':PW},body:JSON.stringify(DATA)});
    const j = await r.json().catch(()=>({}));
    if(!r.ok) throw new Error(j.error || 'Save failed');
    msg('Saved. Site is updated.');
  }catch(err){ msg(err.message, true); }
});
</script>
</body>
</html>
